name: Animated GitHub Activity

on:
  workflow_dispatch:

  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Generate animated activity SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

        run: |
          python scripts/generate_activity_svg.py


      - name: Commit generated graph
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-activity.svg

          git diff --cached --quiet || \
          git commit -m "Update animated GitHub activity graph"

          git push
